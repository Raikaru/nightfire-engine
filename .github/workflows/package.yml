name: Packages

on:
  push:
    branches: [master, 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl-dev libzstd-dev zlib1g-dev libavformat-dev libavcodec-dev libswscale-dev libavutil-dev pkg-config xvfb libx11-dev libxext-dev libxrender-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libwayland-egl-backend-dev libegl1-mesa-dev libasound2-dev libudev-dev libpulse-dev libpipewire-0.3-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Create tar.gz
        run: (cd build && cpack -G TGZ)
      - name: Install appimagetool
        run: |
          curl -fsSL -o appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          sudo mv appimagetool.AppImage /usr/local/bin/appimagetool
      - name: Create AppImage
        run: packaging/linux/build-appimage.sh build dist/nightfire-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build/*.tar.gz
            dist/*.AppImage

  windows:
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-bincache,readwrite
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-bincache
          key: vcpkg-bin-x64-windows-9e593bb1-zlib-zstd-pkgconf
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
      - name: Install dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/vcpkg-bincache" | Out-Null
          & "$env:GITHUB_WORKSPACE/vcpkg/vcpkg.exe" install zlib zstd pkgconf --triplet x64-windows
      - name: Install pinned LGPL FFmpeg
        shell: pwsh
        run: |
          $tag = "autobuild-2026-09-30-13-08"
          $asset = "ffmpeg-n8.1.3-9-g29e619e767-win64-lgpl-shared-8.1.zip"
          $archive = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/$tag/$asset" -OutFile $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($hash -ne "3e47bda1607740550141e37c0e49d1e5182b34699f15adfd137ee266d346811a") {
            throw "Pinned FFmpeg archive SHA-256 mismatch: $hash"
          }
          $extract = "$env:RUNNER_TEMP\ffmpeg"
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $env:FFMPEG_ROOT = Join-Path $extract "ffmpeg-n8.1.3-9-g29e619e767-win64-lgpl-shared-8.1"
          $gpl = Join-Path $env:FFMPEG_ROOT "COPYING.GPLv3"
          Invoke-WebRequest "https://raw.githubusercontent.com/FFmpeg/FFmpeg/n8.1.3/COPYING.GPLv3" -OutFile $gpl
          $licenseHash = (Get-FileHash -Algorithm SHA256 $gpl).Hash.ToLowerInvariant()
          if ($licenseHash -ne "8ceb4b9ee5adedde47b31e975c1d90c73ad27b6b165a1dcd80c7c545eb65b903") {
            throw "FFmpeg GPL license SHA-256 mismatch: $licenseHash"
          }
          if (!(Test-Path (Join-Path $env:FFMPEG_ROOT "lib\pkgconfig\libavcodec.pc"))) {
            throw "Pinned FFmpeg archive has an unexpected layout"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "FFMPEG_ROOT=$env:FFMPEG_ROOT"
      - name: Configure
        shell: pwsh
        run: |
          $env:PKG_CONFIG_PATH = "$env:FFMPEG_ROOT\lib\pkgconfig"
          $env:PKG_CONFIG_EXECUTABLE = "$env:GITHUB_WORKSPACE/vcpkg/installed/x64-windows/tools/pkgconf/pkgconf.exe"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DFFMPEG_ROOT="$env:FFMPEG_ROOT"
      - name: Build
        run: cmake --build build --parallel 4
      - name: Create ZIP
        run: cpack --config build/CPackConfig.cmake -G ZIP --package-directory build
      - name: Create NSIS installer
        run: |
          choco install nsis -y
          cpack --config build/CPackConfig.cmake -G NSIS --package-directory build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            build/*.zip
            build/*.exe

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install ninja pkg-config ffmpeg zstd
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3
      - name: Build
        run: cmake --build build --parallel 2
      - name: Create DMG
        run: (cd build && cpack -G DragNDrop)
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: build/*.dmg

  private-data:
    runs-on: ubuntu-24.04
    outputs:
      available: ${{ steps.gate.outputs.available }}
    steps:
      - id: gate
        env:
          KEY: ${{ secrets.NF_DATA_DEPLOY_KEY }}
        run: echo "available=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  linux-disc-smoke:
    needs: [linux, private-data]
    if: needs.private-data.outputs.available == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install smoke-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xdotool zstd xvfb libopengl0 libgl1 libegl1 libgl1-mesa-dri ffmpeg libasound2t64 libpulse0
      # The repository is public: the ISO is never cached (fork PRs can restore base-branch caches) and
      # disc-derived screenshots are never uploaded. Only the deploy key, absent on fork PRs, reaches the data.
      - name: Fetch and reassemble private ISO
        uses: actions/checkout@v4
        with:
          repository: Raikaru/nightfire-ci-data
          ssh-key: ${{ secrets.NF_DATA_DEPLOY_KEY }}
          path: .private-data
          sparse-checkout: iso/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Decompress and verify ISO
        run: |
          cat .private-data/iso/nightfire-usa.iso.zst.part* | zstd -d -T0 -o "$RUNNER_TEMP/nightfire-usa.iso"
          echo "$(awk '{print $1}' .private-data/iso/iso.sha1)  $RUNNER_TEMP/nightfire-usa.iso" | sha1sum --check
          rm -rf .private-data
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: package
      - name: Unpack Linux tarball
        run: |
          mkdir -p "$RUNNER_TEMP/nightfire-install"
          tar -xzf "$(find package -type f -name '*.tar.gz' -print -quit)" -C "$RUNNER_TEMP/nightfire-install"
          echo "NIGHTFIRE=$(find "$RUNNER_TEMP/nightfire-install" -type f -path '*/bin/nightfire' -print -quit)" >> "$GITHUB_ENV"
          echo "NFDUMP=$(find "$RUNNER_TEMP/nightfire-install" -type f -path '*/bin/nfdump' -print -quit)" >> "$GITHUB_ENV"
      - name: Capture first-run wizard
        run: |
          mkdir -p "$RUNNER_TEMP/wizard-home" "$RUNNER_TEMP/nightfire-shots"
          HOME="$RUNNER_TEMP/wizard-home" XDG_CONFIG_HOME="$RUNNER_TEMP/wizard-home/config" \
            XDG_DATA_HOME="$RUNNER_TEMP/wizard-home/data" \
            xvfb-run -a "$NIGHTFIRE" --shot "$RUNNER_TEMP/nightfire-shots/wizard.bmp"
      - name: Compile ISO smoke helper
        run: |
          cat > "$RUNNER_TEMP/iso-smoke.cpp" <<'EOF'
          #include "assets/iso9660.hpp"
          #include <exception>
          #include <iostream>
          #include <string>
          int main(int argc, char** argv) {
              try {
                  if (argc == 3) {
                      const nf::DiscIdentity disc = nf::identify_nightfire_disc(argv[1]);
                      if (disc.boot_id != "SLUS-20579") {
                          std::cerr << "unexpected boot id " << disc.boot_id << '\n';
                          return 2;
                      }
                      nf::extract_nightfire_disc(argv[1], argv[2]);
                      return 0;
                  }
                  if (argc == 2) {
                      try {
                          (void)nf::identify_nightfire_disc(argv[1]);
                      } catch (const std::exception& error) {
                          if (std::string(error.what()).find("too small to be a PS2 ISO9660 image") !=
                              std::string::npos) return 0;
                          std::cerr << error.what() << '\n';
                          return 1;
                      }
                  }
                  return 1;
              } catch (const std::exception& error) {
                  std::cerr << error.what() << '\n';
                  return 1;
              }
          }
          EOF
          c++ -std=c++20 -Wall -Wextra -Werror -Isrc src/assets/iso9660.cpp "$RUNNER_TEMP/iso-smoke.cpp" -o "$RUNNER_TEMP/iso-smoke"
      - name: Extract and validate user disc
        run: |
          export HOME="$RUNNER_TEMP/wizard-home"
          export XDG_CONFIG_HOME="$HOME/config"
          export XDG_DATA_HOME="$HOME/data"
          "$RUNNER_TEMP/iso-smoke" "$RUNNER_TEMP/nightfire-usa.iso" "$HOME/data/nightfire"
          "$NFDUMP" "$HOME/data/nightfire" validate | tee "$RUNNER_TEMP/nfdump.log"
          grep -q 'failures 0' "$RUNNER_TEMP/nfdump.log"
          mkdir -p "$RUNNER_TEMP/disc-shots"
          xvfb-run -a "$NIGHTFIRE" "$HOME/data/nightfire" --page 0x40000002 --press wait90 --frames 30 --mute \
            --shot "$RUNNER_TEMP/disc-shots/main-menu.bmp"
          xvfb-run -a "$NIGHTFIRE" "$HOME/data/nightfire" --mp 07000024.bin --mode arena --bots 3 --frames 300 --mute \
            --shot "$RUNNER_TEMP/disc-shots/mp-skyrail.bmp"
          # Disc-derived frames stay on the runner; assert they rendered real content instead of uploading them.
          for shot in "$RUNNER_TEMP"/disc-shots/*.bmp; do
            python3 - "$shot" <<'EOF'
          import struct, sys
          data = open(sys.argv[1], 'rb').read()
          offset = struct.unpack_from('<I', data, 10)[0]
          pixels = data[offset:]
          distinct = len(set(pixels[i:i + 3] for i in range(0, len(pixels) - 3, 3 * 97)))
          print(sys.argv[1], 'distinct sampled colours', distinct)
          sys.exit(0 if distinct >= 64 else 1)
          EOF
          done
          rm -rf "$RUNNER_TEMP/disc-shots" "$RUNNER_TEMP/nightfire-usa.iso" "$HOME/data/nightfire"
      - name: Reject a wrong file
        run: |
          printf 'not an ISO image\n' > "$RUNNER_TEMP/wrong-disc.iso"
          "$RUNNER_TEMP/iso-smoke" "$RUNNER_TEMP/wrong-disc.iso"
      - uses: actions/upload-artifact@v4
        with:
          name: first-run-wizard-screenshot
          path: ${{ runner.temp }}/nightfire-shots/wizard.bmp
